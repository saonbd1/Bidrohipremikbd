name: Schedule Random Facebook Post

on:
  # Run daily at 9 AM UTC
  schedule:
    - cron: '0 9 * * *'
  # Or run manually from Actions tab
  workflow_dispatch:

jobs:
  schedule-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Schedule Facebook Post
        env:
          PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          node schedule-facebook-post.js
